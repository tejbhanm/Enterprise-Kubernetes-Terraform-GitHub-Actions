name: "Terraform Deploy (Main)"

on:
  push:
    branches: [ "main" ]
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  contents: read

concurrency:
  group: terraform-kind-env
  cancel-in-progress: false

jobs:
  apply:
    name: "Enterprise Apply"
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: environments/dev-kind
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
